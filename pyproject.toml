[project]
name = "lessnews"
version = "0.0.1"
description = "LessNews fixes news article links to point to the original source."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.4",
    "huey>=2.5.4",
    "litestar>=2.18.0",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "coverage>=7.11.3",
    "coveralls>=4.0.2",
    "httpx>=0.28.1",
    "mypy>=1.18.2",
    "pytest>=9.0.3",
    "ruff>=0.14.5",
]

[project.scripts]
lessnews = "lessnews.__main__:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lessnews"
version = "0.0.2"
description = "LessNews fixes news article links to point to the original source."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.1",
    "huey>=3.0.1",
    "litestar>=2.23.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "coverage>=7.14.1",
    "coveralls>=4.0.2",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14.5",
    "ty>=0.0.48",
]

[project.scripts]
lessnews = "lessnews.__main__:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
